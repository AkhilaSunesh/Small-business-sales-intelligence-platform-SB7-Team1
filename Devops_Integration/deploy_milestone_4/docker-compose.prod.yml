# Production Docker Compose - Milestone 4 Draft
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - mmind-prod-network

  backend:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - mmind-prod-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: always
    ports:
      - "80:3000"
    networks:
      - mmind-prod-network
    depends_on:
      - backend

volumes:
  prod_postgres_data:

networks:
  mmind-prod-network:
    driver: bridge
