

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: mmind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketmind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-marketmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Core Backend API
  backend:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.backend
    container_name: mmind-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/marketmind_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey123!}
      PORT: ${BACKEND_PORT:-5000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:5001}
      SECURITY_GATEWAY_URL: ${SECURITY_GATEWAY_URL:-http://security-gateway:7000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - logs:/app/logs
    networks:
      - mmind-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AI Forecasting Service
  ai-service:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.ai
    container_name: mmind-ai
    restart: always
    environment:
      PORT: ${AI_SERVICE_PORT:-5001}
    ports:
      - "${AI_SERVICE_PORT:-5001}:5001"
    networks:
      - mmind-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${AI_SERVICE_PORT:-5001}/', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Security Gateway
  security-gateway:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.security
    container_name: mmind-security-gateway
    restart: always
    environment:
      PORT: ${SECURITY_GATEWAY_PORT:-7000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/marketmind_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey123!}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:5000/api}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-supersecretrefreshkey123!}
      RECOMMENDATION_URL: http://ai-recommendation:5012
      CUSTOMER_SEGMENTATION_URL: http://ai-segmentation:5010
      CHURN_PREDICTION_URL: http://ai-churn:5011
      ANOMALY_DETECTION_URL: http://ai-anomaly:5013
    ports:
      - "${SECURITY_GATEWAY_PORT:-7000}:7000"
    volumes:
      - logs:/app/logs
    networks:
      - mmind-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AI Customer Segmentation
  ai-segmentation:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.ai-flask
      args:
        SERVICE_NAME: segmentation
    container_name: mmind-ai-segmentation
    restart: always
    networks:
      - mmind-network

  # AI Churn Prediction
  ai-churn:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.ai-flask
      args:
        SERVICE_NAME: churn
    container_name: mmind-ai-churn
    restart: always
    networks:
      - mmind-network

  # AI Product Recommendation
  ai-recommendation:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.ai-flask
      args:
        SERVICE_NAME: recommendation
    container_name: mmind-ai-recommendation
    restart: always
    networks:
      - mmind-network

  # AI Anomaly Detection
  ai-anomaly:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.ai-flask
      args:
        SERVICE_NAME: anomaly
    container_name: mmind-ai-anomaly
    restart: always
    networks:
      - mmind-network

  # Invoice Service
  invoice-service:
    build:
      context: ./Invoice_Service
      dockerfile: ../Dockerfile.invoice
    container_name: mmind-invoice
    restart: always
    environment:
      PORT: ${INVOICE_SERVICE_PORT:-5002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/marketmind_db?schema=public}
    ports:
      - "${INVOICE_SERVICE_PORT:-5002}:5002"
    networks:
      - mmind-network
    depends_on:
      postgres:
        condition: service_healthy

  # Notifications Service
  notifications-service:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.notifications
    container_name: mmind-notifications
    restart: always
    environment:
      PORT: ${NOTIFICATIONS_SERVICE_PORT:-5007}
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-5007}:5007"
    networks:
      - mmind-network

  # AI Random Forest
  ai-random-forest:
    build:
      context: ./AI_RandomForest
    container_name: mmind-ai-rf
    restart: always
    ports:
      - "5003:5000"
    networks:
      - mmind-network

  # AI XGBoost
  ai-xgboost:
    build:
      context: ./AI_XGBoost
    container_name: mmind-ai-xgb
    restart: always
    ports:
      - "5004:5000"
    networks:
      - mmind-network

  # AI Hyperparameter
  ai-hyperparameter:
    build:
      context: ./AI_Hyperparameter
    container_name: mmind-ai-hp
    restart: always
    ports:
      - "5005:5000"
    networks:
      - mmind-network

  # AI Model Comparison
  ai-model-comparison:
    build:
      context: ./AI_ModelComparison
    container_name: mmind-ai-mc
    restart: always
    ports:
      - "5006:5000"
    networks:
      - mmind-network

  # Frontend Web UI
  frontend:
    build:
      context: ../
      dockerfile: Devops_Integration/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: mmind-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - mmind-network
    depends_on:
      - backend
      - security-gateway

volumes:
  postgres_data:
    driver: local
  logs:
    driver: local

networks:
  mmind-network:
    driver: bridge
