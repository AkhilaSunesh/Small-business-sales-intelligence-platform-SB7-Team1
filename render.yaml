services:
  # MarketMind AI - Unified Intelligence Platform Monolith
  - type: web
    name: marketmind-ai-unified
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET
        value: supersecretjwtkey123!
      - key: REFRESH_TOKEN_SECRET
        value: supersecretrefreshkey123!
      - key: DATABASE_URL
        sync: false
