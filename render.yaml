services:
  # 1. PostgreSQL Database Service & Backend
  - type: web
    name: marketmind-backend
    env: node
    plan: free
    rootDir: Backend_Databse
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # 2. Security API Gateway
  - type: web
    name: marketmind-security-gateway
    env: node
    plan: free
    rootDir: Security_API_gateway
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: marketmind-backend
          property: host
      - key: RECOMMENDATION_URL
        fromService:
          type: web
          name: marketmind-ai-recommendation
          property: host
      - key: CUSTOMER_SEGMENTATION_URL
        fromService:
          type: web
          name: marketmind-ai-segmentation
          property: host
      - key: CHURN_PREDICTION_URL
        fromService:
          type: web
          name: marketmind-ai-churn
          property: host
      - key: ANOMALY_DETECTION_URL
        fromService:
          type: web
          name: marketmind-ai-anomaly
          property: host

  # 3. AI Service (Forecasting)
  - type: web
    name: marketmind-ai-service
    env: python
    plan: free
    buildCommand: pip install -r Devops_Integration/ai_requirements.txt
    startCommand: uvicorn Devops_Integration.ai_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 5001

  # 4. AI Recommendation Service
  - type: web
    name: marketmind-ai-recommendation
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r AIML/api/recommendation/requirements.txt
    startCommand: python AIML/api/recommendation/app.py
    envVars:
      - key: PORT
        value: 5012

  # 5. AI Customer Segmentation Service
  - type: web
    name: marketmind-ai-segmentation
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r AIML/api/segmentation/requirements.txt
    startCommand: python AIML/api/segmentation/app.py
    envVars:
      - key: PORT
        value: 5010

  # 6. AI Churn Prediction Service
  - type: web
    name: marketmind-ai-churn
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r AIML/api/churn/requirements.txt
    startCommand: python AIML/api/churn/app.py
    envVars:
      - key: PORT
        value: 5011

  # 7. AI Anomaly Detection Service
  - type: web
    name: marketmind-ai-anomaly
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r AIML/api/anomaly/requirements.txt
    startCommand: python AIML/api/anomaly/app.py
    envVars:
      - key: PORT
        value: 5013

  # 8. Frontend React Static Site
  - type: web
    name: marketmind-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: marketmind-security-gateway
          property: host

databases:
  - name: marketmind-db
    plan: free
    databaseName: marketmind_db
    user: marketmind_user
