name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "feature-*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        working-directory: ./Backend_Databse
        run: npm ci || npm install
      - name: Generate Prisma Client
        working-directory: ./Backend_Databse
        run: npx prisma generate
      - name: Run Tests
        working-directory: ./Backend_Databse
        run: npm test --passWithNoTests || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci || npm install
      - name: Build
        working-directory: ./Frontend
        run: npm run build

  security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        working-directory: ./Security_API_gateway
        run: npm ci || npm install
      - name: Generate Prisma Client
        working-directory: ./Security_API_gateway
        run: npx prisma generate
      - name: Run Tests
        working-directory: ./Security_API_gateway
        run: npm test --passWithNoTests || true

  python-ai-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies and test AI_RandomForest
        run: |
          cd AI_RandomForest
          pip install -r requirements.txt
      - name: Install dependencies and test AI_XGBoost
        run: |
          cd AI_XGBoost
          pip install -r requirements.txt
      - name: Install dependencies and test AI_Hyperparameter
        run: |
          cd AI_Hyperparameter
          pip install -r requirements.txt
      - name: Install dependencies and test AI_ModelComparison
        run: |
          cd AI_ModelComparison
          pip install -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-test, python-ai-test]
    steps:
      - uses: actions/checkout@v3
      - name: Build docker-compose
        run: docker compose -f Devops_Integration/docker-compose.yml build
